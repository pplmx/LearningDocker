services:
    db:
        image: postgres
        restart: always
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - "5432:5432"
        volumes:
            - postgresql:/var/lib/postgresql
            - postgresql_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
            interval: 10s
            timeout: 5s
            retries: 5

    adminer:
        image: adminer
        restart: always
        ports:
            - "8080:8080"
volumes:
    postgresql:
    postgresql_data:
