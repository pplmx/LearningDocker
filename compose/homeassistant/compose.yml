services:
    ha:
        image: homeassistant/home-assistant
        privileged: true
        network_mode: host
        restart: unless-stopped
        environment:
            - TZ=Asia/Shanghai
        extra_hosts:
            - "host.docker.internal:${HOST_IP:?set HOST_IP in .env (see .env.example)}"
        volumes:
            - ./config:/config
            - /etc/localtime:/etc/localtime:ro
            - /run/dbus:/run/dbus:ro
