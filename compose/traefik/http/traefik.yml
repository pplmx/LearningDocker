### Static Configuration
log:
    level: INFO
api:
    dashboard: true
entryPoints:
    web:
        address: :80
        http:
            redirections:
                entryPoint:
                    to: websecure
                    scheme: https
                    permanent: true
    websecure:
        address: :443
        http3: {}  # Enables HTTP/3 support
providers:
    file:
        # location in traefik container
        # filename: /traefik.yml
        directory: /etc/traefik/dynamic-conf
        watch: true
