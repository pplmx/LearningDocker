default_install_hook_types:
    - pre-commit
    - commit-msg

default_stages:
    - pre-commit

fail_fast: true

repos:
    - repo: builtin
      hooks:
          - id: end-of-file-fixer
          - id: trailing-whitespace
            exclude: \.md$
          - id: check-toml
          - id: check-yaml
          - id: check-merge-conflict
          - id: mixed-line-ending
            args: ["--fix=lf"]

    - repo: https://github.com/commitizen-tools/commitizen
      rev: v4.17.0
      hooks:
          - id: commitizen

    - repo: https://github.com/rvben/rumdl-pre-commit
      rev: v0.2.52
      hooks:
          - id: rumdl
            args: [--fix]
            exclude: (CHANGELOG\.md$|docs/audits/)
          - id: rumdl-fmt
            exclude: (CHANGELOG\.md$|docs/audits/)
